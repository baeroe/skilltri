name: Release

# Pushing a tag vX.Y.Z runs the tests and publishes a GitHub release with generated notes.
# The Homebrew tap (baeroe/homebrew-tap) picks up the new release within an hour.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "skilltri ${GITHUB_REF_NAME#v}"
